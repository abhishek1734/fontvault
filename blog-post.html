  <style>
    .post-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 6rem 2rem;
    }
    .post-header {
      margin-bottom: 3.5rem;
      border-bottom: 1px solid var(--border-grey);
      padding-bottom: 2.5rem;
    }
    .post-meta {
      font-family: var(--font-mono), monospace;
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1rem;
    }
    .post-body {
      font-size: 1.15rem;
      line-height: 1.8;
      color: var(--near-black);
    }
    .post-body p {
      margin-bottom: 2rem;
    }
    .post-body h2 {
      font-family: var(--font-display);
      font-size: 2rem;
      margin: 3rem 0 1.5rem;
    }
    .share-container {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-grey);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .share-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-grey);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .post-container {
        padding: 3rem 1.25rem !important;
      }
      .post-header h1 {
        font-size: clamp(2rem, 6vw, 2.75rem) !important;
      }
      .share-container {
        flex-direction: column;
        gap: 1.25rem;
        align-items: flex-start !important;
      }
    }
    @media (max-width: 480px) {
      .post-container {
        padding: 2rem 1rem !important;
      }
      .post-header h1 {
        font-size: clamp(1.75rem, 6.5vw, 2.25rem) !important;
      }
      .post-body {
        font-size: 1.05rem;
        line-height: 1.7;
      }
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Dark toggle setup
      const toggle = document.getElementById('dark-toggle');
      if (toggle) {
        toggle.addEventListener('click', () => {
          const isDark = document.documentElement.getAttribute("data-theme") === "dark";
          document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
          localStorage.setItem("fontvault-dark", isDark ? "0" : "1");
        });
      }

      // Resolve Post Slug
      const urlParams = new URLSearchParams(window.location.search);
      let postSlug = urlParams.get('slug') || urlParams.get('post') || window.location.pathname.split("/blog/")[1] || "pairing-serif-sans-guide";

      const post = blogData[postSlug];
      if (!post) {
        document.getElementById('post-root').innerHTML = `<div style="text-align:center; padding: 4rem;"><h2>Post Not Found</h2><a href="/blog.html">Back to Blog</a></div>`;
        return;
      }

      // Render Dynamic SEO
      if (window.FontVaultSEO) {
        const canonical = `${window.FontVaultSEO.CANONICAL_HOST}/blog/${postSlug}`;
        window.FontVaultSEO.updateMetadata(post.title + " | FontVault Blog", post.description, canonical, "article");

        // Schemas
        const breadcrumbSchema = {
          "@context": "https://schema.org",
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": `${window.FontVaultSEO.CANONICAL_HOST}/` },
            { "@type": "ListItem", "position": 2, "name": "Blog", "item": `${window.FontVaultSEO.CANONICAL_HOST}/blog.html` },
            { "@type": "ListItem", "position": 3, "name": post.title, "item": canonical }
          ]
        };

        const articleSchema = {
          "@context": "https://schema.org",
          "@type": "BlogPosting",
          "headline": post.title,
          "description": post.description,
          "author": {
            "@type": "Person",
            "name": post.author
          },
          "datePublished": post.datePublished,
          "dateModified": post.dateModified || post.datePublished,
          "mainEntityOfPage": canonical,
          "image": `${window.FontVaultSEO.CANONICAL_HOST}/assets/branding.png`
        };

        window.FontVaultSEO.injectSchema(breadcrumbSchema, "breadcrumb-schema");
        window.FontVaultSEO.injectSchema(articleSchema, "article-schema");

        // Visual crumbs
        const crumbs = [
          { name: "Home", url: "/" },
          { name: "Blog", url: "/blog.html" },
          { name: post.title, url: `/blog/${postSlug}` }
        ];
        document.getElementById('breadcrumbs-injection-point').innerHTML = window.FontVaultSEO.renderBreadcrumbs(crumbs);
      }

      // Render Layout
      document.getElementById('post-root').innerHTML = `
        <header class="post-header">
          <div class="post-meta">
            <span>${post.category}</span>
            <span>&middot;</span>
            <span>Published: ${post.datePublished}</span>
            <span>&middot;</span>
            <span>${post.readTime} Read</span>
          </div>
          <h1 style="font-family: var(--font-display); font-size: clamp(2.2rem, 5vw, 3.5rem); line-height: 1.1; margin-bottom: 1.5rem;">${post.title}</h1>
          <p style="color: #666; font-size: 1.1rem; line-height: 1.6; font-style: italic;">${post.description}</p>
        </header>

        <section class="post-body">
          <p>${post.content}</p>
          <p>Practical typography matters. When designing web layouts, testing fonts on live mockups before implementation saves hours of guesswork. In future articles, we will explore other open-source typefaces in depth.</p>
        </section>

        <div class="share-container">
          <span style="font-size:0.85rem; color:#666;">Written by <strong>${post.author}</strong></span>
          <div style="display:flex; gap:0.5rem;">
            <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href); alert('Link copied to clipboard!');">Copy Link</button>
            <button class="share-btn" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(window.location.href)+'&text='+encodeURI('${post.title}'), '_blank')">Share on X</button>
          </div>
        </div>
      `;
    });
  </script>
